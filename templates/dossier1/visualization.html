<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- API base used by frontend JS; production backend URL -->
    <meta name="api-base" content="https://e-cities-back.onrender.com">
    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="../../assets/images/favicon.svg">
    <title>E-cities — Visualisation 3D</title>
    <link rel="stylesheet" href="../../assets/styles/styles.css">
    <style>
      /* page-specific overrides */
      #viewer{width:100%;height:58vh;background:#111;border-radius:8px;overflow:hidden;position:relative;border:1px solid #222}
      .viz-actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
      .drop-hint{padding:12px;border:1px dashed #444;border-radius:8px;margin-top:12px;color:#ddd;background:rgba(255,255,255,0.03)}
      .drop-hint strong{color:#fff}
      .viewer-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;pointer-events:none;transition:opacity .2s;}
      .viewer-overlay.hidden{opacity:0}
      .viewer-overlay.drop{background:rgba(64,160,255,0.08);border:2px dashed rgba(64,160,255,0.4)}
      #viewer canvas{display:block;width:100%;height:100%}
    </style>
  </head>
  <body>
    <header class="top">
      <div class="container top-inner">
        <div class="brand">
          <img id="brandLogo" src="../../assets/images/logo.png" alt="E-cities logo" />
          <div class="brand-text">
            <div class="logo">E-cities</div>
            <div class="tag">Redécouvrez votre quartier</div>
          </div>
        </div>
        <nav class="nav">
          <a href="/templates/dossier1/index.html">Accueil</a>
          <a href="/templates/dossier1/projects.html">Projets Citoyens</a>
          <a href="/templates/dossier1/visualization.html">Visualisation 3D</a>
          <a href="/templates/dossier1/index.html#contact">Contact</a>
          <button id="langBtn" class="lang" aria-pressed="false">FR</button>
          <button id="accountBtn" class="account-btn" aria-haspopup="dialog" aria-expanded="false">Compte</button>
          <button id="inboxBtn" class="inbox-btn" aria-label="Boîte de réception" title="Boîte de réception">
            ✉
            <span class="badge" id="inboxBadge" style="display:none">0</span>
          </button>
        </nav>
      </div>
    </header>

    <main>
      <section class="container section boxed">
        <h2 class="center">Visualisation 3D</h2>
        <div id="viewer" role="application" aria-label="3D viewer">
          <div class="viewer-overlay" id="viewerOverlay">Glissez-déposez votre fichier IFC ici</div>
        </div>
        <div class="viz-actions">
          <label class="btn secondary" for="ifcInput">Choisir un fichier IFC</label>
          <input id="ifcInput" type="file" accept=".ifc" style="display:none">
          <button id="resetView" class="btn">Réinitialiser la vue</button>
          <div id="vizMsg" class="auth-msg" style="margin-left:auto"></div>
        </div>
        <div class="drop-hint">Glissez-déposez un fichier <strong>.ifc</strong> ou utilisez le bouton pour le charger. La scène s'adapte automatiquement à votre modèle.</div>
      </section>
    </main>
    <script src="../../assets/scripts/i18n.js"></script>
    <script src="../../assets/scripts/auth.js"></script>
    <script src="../../assets/scripts/inbox.js"></script>
    <script src="../../assets/scripts/chatbot.js"></script>
    <script src="../../assets/scripts/footer.js"></script>
    <!-- Dynamic loader: tries local vendor first, then CDN fallbacks -->
    <script>
      async function loadScriptSequential(sources){
        for(const src of sources){
          try{
            await new Promise((resolve, reject)=>{
              const s = document.createElement('script');
              s.src = src; s.async = false; s.crossOrigin = 'anonymous';
              s.onload = ()=> resolve();
              s.onerror = ()=> reject(new Error('Failed '+src));
              document.head.appendChild(s);
            });
            return true;
          }catch(e){ console.warn(e.message); }
        }
        return false;
      }
      window.__loadViewerLibs = async function(){
        const okThree = await loadScriptSequential([
          '/assets/vendor/three/three.min.js',
          'https://unpkg.com/three@0.152.2/build/three.min.js'
        ]);
        return okThree;
      }
    </script>
    <script>

      const container = document.getElementById('viewer');
      const overlay = document.getElementById('viewerOverlay');
      const resetBtn = document.getElementById('resetView');
      const msgEl = document.getElementById('vizMsg');

      function showMsg(text, type='info'){ if(!msgEl) return; msgEl.textContent = text || ''; msgEl.className = 'auth-msg ' + type; }

      if(!container){ console.error('Viewer container missing'); }

      let scene, renderer, camera;
      let orbitTarget, orbitRadius = 12;
      let isDragging = false, lastX = 0, lastY = 0;
      let rotX = 0, rotY = 0;

      // Lumières
      function addLights(){
        const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 0.9);
        hemi.position.set(0,2,0);
        scene.add(hemi);
        const dir = new THREE.DirectionalLight(0xffffff, 0.8);
        dir.position.set(10,20,10);
        scene.add(dir);
      }

      // Sol
      let ground;
      function addGround(){
        ground = new THREE.Mesh(
          new THREE.PlaneGeometry(200,200),
          new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:0.95 })
        );
        ground.rotation.x = -Math.PI/2;
        ground.position.y = -0.01;
        scene.add(ground);
      }

      function onWindowResize(){
        if(!camera || !renderer) return;
        const w = container.clientWidth || 800, h = container.clientHeight || 400;
        camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
      }

      overlay.classList.add('hidden');

      function fitCameraToObject(object){
        const box = new THREE.Box3().setFromObject(object);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxSize = Math.max(size.x, size.y, size.z);
        const dist = maxSize * 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
        camera.position.copy(center.clone().add(new THREE.Vector3(1,1,1).normalize().multiplyScalar(dist)));
        camera.near = dist / 100;
        camera.far = dist * 100;
        camera.updateProjectionMatrix();
        if(orbitTarget) orbitTarget.copy(center);
        else orbitTarget = center.clone();
        orbitRadius = dist;
        camera.lookAt(center);
      }

      async function ensureIfcExists(url){
        try{
          const r = await fetch(url, { method:'HEAD' });
          if(!r.ok){ throw new Error('IFC non trouvé'); }
          return true;
        }catch(e){
          overlay.classList.remove('hidden');
          overlay.textContent = 'Placez votre IFC à ' + url + ' puis rechargez.';
          showMsg('Fichier IFC introuvable: ' + url.split('/').pop(), 'error');
          return false;
        }
      }

      async function loadIFCFile(url){
        try{
          showMsg('Chargement du fichier IFC...', 'info');
          const res = await fetch(url, { cache:'no-store' });
          if(!res.ok){ showMsg('Fichier IFC introuvable', 'error'); return; }
          const text = await res.text();

          // Parse simple : extraire les murs et créer des boîtes 3D
          const group = new THREE.Group();
          const wallMatches = [...text.matchAll(/#(\d+)=IFCWALLSTANDARDCASE\([^)]+\)/g)];
          
          if(wallMatches.length > 0){
            wallMatches.forEach((match, i) => {
              const geo = new THREE.BoxGeometry(10, 3, 0.3);
              const mat = new THREE.MeshStandardMaterial({ 
                color: 0x888888, 
                metalness: 0.1, 
                roughness: 0.8 
              });
              const wall = new THREE.Mesh(geo, mat);
              
              // Position simplifiée: layout en grille
              wall.position.x = (i % 3) * 6 - 6;
              wall.position.z = Math.floor(i / 3) * 5;
              wall.position.y = 1.5;
              group.add(wall);
            });
            
            scene.add(group);
            fitCameraToObject(group);
            showMsg(`Modèle IFC chargé (${wallMatches.length} murs)`, 'info');
          } else {
            // Si pas de murs, afficher un cube simple
            const geo = new THREE.BoxGeometry(6, 3, 4);
            const mat = new THREE.MeshStandardMaterial({ color: 0xbb8844 });
            const house = new THREE.Mesh(geo, mat);
            house.position.y = 1.5;
            scene.add(house);
            fitCameraToObject(house);
            showMsg('Modèle IFC chargé (structure basique)', 'info');
          }
        }catch(err){
          showMsg('Erreur chargement: ' + err.message, 'error');
          console.error(err);
        }
      }

      resetBtn.addEventListener('click', ()=>{
        camera.position.set(8, 6, 12);
      });

      (async () => {
        overlay.textContent = 'Chargement des librairies 3D...';
        const libsOk = await window.__loadViewerLibs();
        if(!libsOk){
          overlay.classList.remove('hidden');
          overlay.textContent = 'Impossible de charger Three.js. Vérifiez la connexion.';
          showMsg('Three.js introuvable (local/CDN)', 'error');
          return;
        }

        // Init Three.js après charge des libs
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);

        renderer = new THREE.WebGLRenderer({ antialias:true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        container.appendChild(renderer.domElement);

        camera = new THREE.PerspectiveCamera(45, 2, 0.1, 5000);
        camera.position.set(8, 6, 12);

        addLights();
        addGround();

        // Simple orbit controls
        orbitTarget = new THREE.Vector3(0,1.5,0);
        orbitRadius = 12;
        rotX = 0;
        rotY = 0;
        function updateCameraOrbit(){
          const y = orbitTarget.y + Math.sin(rotX) * orbitRadius;
          const r = Math.cos(rotX) * orbitRadius;
          camera.position.x = orbitTarget.x + Math.cos(rotY) * r;
          camera.position.z = orbitTarget.z + Math.sin(rotY) * r;
          camera.position.y = y;
          camera.lookAt(orbitTarget);
        }
        renderer.domElement.addEventListener('mousedown', (e)=>{ isDragging = true; lastX = e.clientX; lastY = e.clientY; });
        window.addEventListener('mouseup', ()=>{ isDragging = false; });
        window.addEventListener('mousemove', (e)=>{
          if(!isDragging) return;
          const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
          rotY -= dx * 0.005; rotX -= dy * 0.005; rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotX));
          updateCameraOrbit();
        });
        renderer.domElement.addEventListener('wheel', (e)=>{
          e.preventDefault(); orbitRadius = Math.max(3, Math.min(80, orbitRadius + e.deltaY * 0.01)); updateCameraOrbit();
        }, { passive:false });

        // Attach resize handling now that camera/renderer exist
        window.addEventListener('resize', onWindowResize);
        onWindowResize();

        //Pour changer l'IFC qui est charger sur la page 3D
        const url = '/assets/ifc/simple_house.ifc';
        const ifcOk = await ensureIfcExists(url);
        if(!ifcOk) return;
        overlay.classList.add('hidden');
        await loadIFCFile(url);
      })();

      function animate(){
        requestAnimationFrame(animate);
        if(renderer && camera){
          renderer.render(scene, camera);
        }
      }
      animate();
    </script>
   </body>
 </html>
