<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- API base used by frontend JS; production backend URL -->
    <meta name="api-base" content="https://e-cities-back.onrender.com">
    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="../../assets/images/favicon.svg">
    <title>E-cities — Visualisation 3D</title>
    <link rel="stylesheet" href="../../assets/styles/styles.css">
    <style>
      /* page-specific overrides */
      #viewer{width:100%;height:58vh;background:#111;border-radius:8px;overflow:hidden;position:relative;border:1px solid #222}
      .viz-actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
      .drop-hint{padding:12px;border:1px dashed #444;border-radius:8px;margin-top:12px;color:#ddd;background:rgba(255,255,255,0.03)}
      .drop-hint strong{color:#fff}
      .viewer-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;pointer-events:none;transition:opacity .2s;}
      .viewer-overlay.hidden{opacity:0}
      .viewer-overlay.drop{background:rgba(64,160,255,0.08);border:2px dashed rgba(64,160,255,0.4)}
      #viewer canvas{display:block;width:100%;height:100%}
    </style>
  </head>
  <body>
    <header class="top">
      <div class="container top-inner">
        <div class="brand">
          <img id="brandLogo" src="../../assets/images/logo.png" alt="E-cities logo" />
          <div class="brand-text">
            <div class="logo">E-cities</div>
            <div class="tag">Redécouvrez votre quartier</div>
          </div>
        </div>
        <nav class="nav">
          <a href="/templates/dossier1/index.html">Accueil</a>
          <a href="/templates/dossier1/projects.html">Projets Citoyens</a>
          <a href="/templates/dossier1/visualization.html">Visualisation 3D</a>
          <a href="/templates/dossier1/index.html#contact">Contact</a>
          <button id="langBtn" class="lang" aria-pressed="false">FR</button>
          <button id="accountBtn" class="account-btn" aria-haspopup="dialog" aria-expanded="false">Compte</button>
          <button id="inboxBtn" class="inbox-btn" aria-label="Boîte de réception" title="Boîte de réception">
            ✉
            <span class="badge" id="inboxBadge" style="display:none">0</span>
          </button>
        </nav>
      </div>
    </header>

    <main>
      <section class="container section boxed">
        <h2 class="center">Visualisation 3D</h2>
        <div id="viewer" role="application" aria-label="3D viewer">
          <div class="viewer-overlay" id="viewerOverlay">Glissez-déposez votre fichier IFC ici</div>
        </div>
        <div class="viz-actions">
          <label class="btn secondary" for="ifcInput">Choisir un fichier IFC</label>
          <input id="ifcInput" type="file" accept=".ifc" style="display:none">
          <button id="resetView" class="btn">Réinitialiser la vue</button>
          <div id="vizMsg" class="auth-msg" style="margin-left:auto"></div>
        </div>
        <div class="drop-hint">Glissez-déposez un fichier <strong>.ifc</strong> ou utilisez le bouton pour le charger. La scène s'adapte automatiquement à votre modèle.</div>
      </section>
    </main>
    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';
      import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/controls/OrbitControls.js';
      import { IFCLoader } from 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/loaders/IFCLoader.js';

      document.addEventListener('DOMContentLoaded', () => {
        const API_BASE = (document.querySelector('meta[name="api-base"]')?.content || 'http://localhost:3000').replace(/\/$/, '');
        function getUser(){ try{ return JSON.parse(localStorage.getItem('ecities_user')); }catch(e){ return null; } }
        const user = getUser();
        let isAdmin = !!(user && user.role === 'Admin');

        const container = document.getElementById('viewer');
        const overlay = document.getElementById('viewerOverlay');
        const fileInput = document.getElementById('ifcInput');
        const resetBtn = document.getElementById('resetView');
        const msgEl = document.getElementById('vizMsg');
        const fileLabel = document.querySelector('label[for="ifcInput"]');

        function showMsg(text, type='info'){ if(!msgEl) return; msgEl.textContent = text || ''; msgEl.className = 'auth-msg ' + type; }
        function showError(text){ showMsg(text || 'Erreur de chargement.', 'error'); console.error(text); }

        // Avoid browser navigating to the IFC file when dropped anywhere on the page
        window.addEventListener('dragover', (e)=>{ e.preventDefault(); });
        window.addEventListener('drop', (e)=>{
          e.preventDefault();
          if(!isAdmin){ showMsg('Chargement IFC réservé aux administrateurs.', 'info'); return; }
          const files = e.dataTransfer && e.dataTransfer.files;
          const isInsideViewer = e.target && container.contains(e.target);
          if(isInsideViewer) handleFiles(files);
        });

        // WebGL support check
        try{
          const canvas = document.createElement('canvas');
          const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          if(!gl){ showError('WebGL non disponible dans ce navigateur.'); return; }
        }catch(e){ showError('Impossible de créer un contexte WebGL.'); return; }

        let currentModel = null;

        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d1117);
        const renderer = new THREE.WebGLRenderer({ antialias:true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, 2, 0.1, 5000);
        camera.position.set(8,6,12);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0,1,0);

        const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 0.9); hemi.position.set(0,2,0); scene.add(hemi);
        const dir = new THREE.DirectionalLight(0xffffff, 0.8); dir.position.set(10,20,10); dir.castShadow = true; scene.add(dir);
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshStandardMaterial({ color:0x0b0f16, roughness:0.95 })); ground.rotation.x = -Math.PI/2; ground.position.y = -0.01; scene.add(ground);

        const loader = new IFCLoader();
        loader.ifcManager.setWasmPath('https://cdn.jsdelivr.net/npm/web-ifc@0.0.44/');

        function onWindowResize(){
          const w = container.clientWidth || container.parentElement.clientWidth || 800;
          const h = container.clientHeight || 400;
          camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
        }
        window.addEventListener('resize', onWindowResize); onWindowResize();

        function fitCameraToObject(object){
          const box = new THREE.Box3().setFromObject(object);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          const maxSize = Math.max(size.x, size.y, size.z);
          const dist = maxSize * 1.6 / Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
          const dir = new THREE.Vector3(1,1,1).normalize();
          camera.position.copy(center.clone().add(dir.multiplyScalar(dist)));
          camera.near = dist / 100; camera.far = dist * 100; camera.updateProjectionMatrix();
          controls.target.copy(center); controls.update();
        }

        function clearModel(){
          if(currentModel){ scene.remove(currentModel); currentModel.traverse(obj=>{ if(obj.isMesh){ obj.geometry?.dispose(); if(obj.material){ if(Array.isArray(obj.material)){ obj.material.forEach(m=>m.dispose && m.dispose()); } else obj.material.dispose && obj.material.dispose(); } } }); currentModel = null; }
        }

        async function loadIFCFile(file){
          if(!file) return;
          if(!file.name.toLowerCase().endsWith('.ifc')){ showError('Format non supporté. Importez un fichier .ifc.'); return; }
          showMsg('Chargement de ' + file.name + ' ...', 'info');
          overlay && overlay.classList.add('hidden');
          try{
            const buffer = await file.arrayBuffer();
            loader.parse(buffer, '', (model)=>{
              clearModel();
              currentModel = model;
              scene.add(model);
              fitCameraToObject(model);
              showMsg('Modèle chargé : ' + file.name, 'info');
            }, (err)=>{ console.error('IFC parse error', err); showError('Echec du chargement IFC. Vérifiez le fichier.'); });
          }catch(err){ console.error(err); showError('Echec du chargement IFC. Vérifiez le fichier ou réessayez.'); }
        }

        function handleFiles(files){
          if(files && files.length){ loadIFCFile(files[0]); }
        }

        function attachAdminHandlers(){
          fileInput.addEventListener('change', (e)=>{ handleFiles(e.target.files); e.target.value=''; });
          container.addEventListener('dragover', (e)=>{ e.preventDefault(); overlay && overlay.classList.add('drop'); });
          container.addEventListener('dragleave', (e)=>{ e.preventDefault(); overlay && overlay.classList.remove('drop'); });
          container.addEventListener('drop', (e)=>{ e.preventDefault(); overlay && overlay.classList.remove('drop'); overlay && overlay.classList.add('hidden'); handleFiles(e.dataTransfer.files); });
          if(overlay) overlay.textContent = 'Glissez-déposez votre fichier IFC ici';
          if(fileInput) fileInput.disabled = false;
          if(fileLabel) fileLabel.classList.remove('disabled');
          showMsg('Mode admin: chargez un fichier IFC.', 'info');
        }

        function disableHandlers(){
          if(overlay){ overlay.textContent = 'Chargement IFC réservé aux administrateurs.'; overlay.classList.remove('hidden'); overlay.style.pointerEvents = 'auto'; }
          showMsg('Vous devez être administrateur pour charger un IFC.', 'info');
          if(fileLabel) fileLabel.classList.add('disabled');
          if(fileInput) fileInput.disabled = true;
        }

        async function checkAdmin(){
          if(isAdmin) { attachAdminHandlers(); return; }
          if(!user || !user.username){ disableHandlers(); return; }
          try{
            const res = await fetch(`${API_BASE}/profile?username=${encodeURIComponent(user.username)}`);
            if(!res.ok) { disableHandlers(); return; }
            const data = await res.json();
            const prof = data && data.profile;
            const expires = prof && prof.admin_expires ? new Date(prof.admin_expires) : null;
            const stillAdmin = (prof && prof.role === 'Admin') || (expires && expires > new Date());
            if(stillAdmin){ isAdmin = true; attachAdminHandlers(); }
            else disableHandlers();
          }catch(err){ console.error('admin check error', err); disableHandlers(); }
        }

        checkAdmin();

        resetBtn.addEventListener('click', ()=>{ controls.reset(); camera.position.set(8,6,12); controls.target.set(0,1,0); controls.update(); });

        function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
        animate();
      });
    </script>
    <script src="../../assets/scripts/i18n.js"></script>
    <script src="../../assets/scripts/auth.js"></script>
    <script src="../../assets/scripts/chatbot.js"></script>
    <script src="../../assets/scripts/footer.js"></script>
   </body>
 </html>
