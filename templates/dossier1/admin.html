<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Administration — E-cities</title>
    <meta name="api-base" content="https://e-cities-back.onrender.com">
    <link rel="stylesheet" href="../../assets/styles/styles.css">
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="../../assets/images/favicon.svg">
    <style>
      .modal-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:2600;padding:16px;}
      .modal-card{background:#0b0b0b;border:1px solid rgba(255,212,0,0.08);border-radius:16px;box-shadow:0 18px 48px rgba(0,0,0,0.6);width:100%;}
      .modal-body{padding:18px;color:#e9e9e9;}
      .modal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
      .modal-title{font-size:1.1rem;font-weight:800;color:var(--accent);}
      .modal-meta{color:#c7c7c7;font-size:0.95rem;}
      .modal-content{white-space:pre-wrap;line-height:1.5;color:#f5f5f5;border-top:1px solid rgba(255,212,0,0.06);padding-top:12px;}
      .btn.ghost{background:transparent;border:1px solid rgba(255,212,0,0.2);color:var(--accent);}
      .btn.danger{background:#a40000;border:1px solid #d00000;color:#fff;}
      .btn.small{padding:6px 12px;font-size:0.95rem;}
    </style>
  </head>
  <body>
    <header class="top">
      <div class="container top-inner">
        <div class="brand">
          <img id="brandLogo" src="../../assets/images/logo.png" alt="E-cities logo" />
          <div class="brand-text">
            <div class="logo">E-cities</div>
            <div class="tag">Redécouvrez votre quartier</div>
          </div>
        </div>
        <nav class="nav">
          <!-- On admin page only one button returning to profile info -->
          <a id="backToProfile" class="account-btn" href="/templates/dossier1/profile.html">Info</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="container section boxed">
        <h2 style="color:var(--accent)">Administration</h2>
        
        <!-- Dashboard Stats -->
        <div id="statsArea" style="margin-top:1.5rem;margin-bottom:2rem">
          <h3 style="color:var(--accent);margin-top:0;margin-bottom:1rem">Statistiques du site</h3>
          <div id="statsGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-bottom:1rem">
            <!-- Stats cards will be inserted here -->
          </div>
          <button id="refreshStatsBtn" class="btn" style="background:var(--accent);color:#000;font-weight:800">↻ Actualiser les stats</button>
        </div>
        
        <!-- Tickets Area -->
        <div id="ticketsArea" style="margin-top:2rem">
          <h3 style="color:var(--accent);margin-top:0">Tickets utilisateurs</h3>
          <div id="ticketsList" style="margin-top:0.8rem;color:#e9e9e9">Chargement...</div>
        </div>
      </section>
    </main>
    <script src="../../assets/scripts/i18n.js"></script>
    <script src="../../assets/scripts/auth.js"></script>
    <script src="../../assets/scripts/chatbot.js"></script>
    <script src="../../assets/scripts/footer.js"></script>
    <script>
      // prevent access if not admin: redirect to profile/info
      (function(){
        try{
          const u = JSON.parse(localStorage.getItem('ecities_user') || 'null');
          if(!u || u.role !== 'Admin'){
            window.location.href = '/templates/dossier1/profile.html';
            return;
          }
        }catch(e){ window.location.href = '/templates/dossier1/profile.html'; return; }

        const API_BASE = (document.querySelector('meta[name="api-base"]')||{}).content || 'http://localhost:3000';
        const user = JSON.parse(localStorage.getItem('ecities_user') || 'null');
        const statsGrid = document.getElementById('statsGrid');
        const listEl = document.getElementById('ticketsList');
        const refreshStatsBtn = document.getElementById('refreshStatsBtn');

        // Stat card template
        function createStatCard(title, value, icon = '📊', color = '#ffd400') {
          return `
            <div class="card" style="padding:1.2rem;display:flex;flex-direction:column;gap:0.8rem;border:1px solid rgba(255,212,0,0.1)">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span style="font-size:1.8rem">${icon}</span>
                <span style="color:${color};font-size:1.4rem;font-weight:800">${value}</span>
              </div>
              <div style="color:#c7c7c7;font-size:0.95rem">${title}</div>
            </div>
          `;
        }

        async function loadStats() {
          try {
            const res = await fetch(API_BASE + '/admin/stats?username=' + encodeURIComponent(user.username));
            if (!res.ok) {
              const errData = await res.json().catch(()=>({}));
              statsGrid.innerHTML = '<div style="color:#ffb3b3;grid-column:1/-1">Erreur: ' + (errData.error || res.status) + '</div>';
              return;
            }
            const data = await res.json();
            const stats = data.stats;

            const html = `
              ${createStatCard('Total utilisateurs', stats.totalUsers, '👥', '#ffd400')}
              ${createStatCard('Utilisateurs ce mois', stats.usersThisMonth, '📅', '#00d9ff')}
              ${createStatCard('Utilisateurs cette semaine', stats.usersThisWeek, '📈', '#00ff88')}
              ${createStatCard('Tickets ouverts', stats.openTickets, '🎫', '#ff6b6b')}
              ${createStatCard('Total tickets', stats.totalTickets, '📋', '#ffd400')}
              ${createStatCard('Tickets cette semaine', stats.ticketsThisWeek, '⏰', '#00ffaa')}
            `;
            statsGrid.innerHTML = html;
          } catch (err) {
            console.error('load stats error', err);
            statsGrid.innerHTML = '<div style="color:#ffb3b3;grid-column:1/-1">Erreur serveur: ' + err.message + '</div>';
          }
        }

        refreshStatsBtn.addEventListener('click', loadStats);

        // Initial load
        loadStats();

        async function fetchTickets(){
          try{
            const url = API_BASE + '/tickets?username=' + encodeURIComponent(user.username);
            const res = await fetch(url);
            if(!res.ok){
              let bodyText = '';
              try{ bodyText = await res.text(); }catch(e){ bodyText = '<no body>'; }
              console.error('tickets list fetch failed', { url, status: res.status, statusText: res.statusText, body: bodyText });
              listEl.textContent = 'Erreur lors du chargement des tickets — ' + res.status + ' ' + (res.statusText || '') + (bodyText ? (': ' + bodyText) : '');
              return;
            }
            const data = await res.json();
            renderList(data.tickets || []);
          }catch(err){ console.error('fetch tickets error', err); listEl.textContent = 'Impossible de contacter le serveur: ' + (err && err.message ? err.message : err); }
        }

        function renderList(tickets){
          if(!tickets || tickets.length === 0){ listEl.innerHTML = '<div style="color:#ddd">Aucun ticket</div>'; return; }
          const out = tickets.map(t => {
            const userReplyBadge = t.has_user_reply ? '<span class="pill" style="margin-left:8px;background:#ffd400;color:#000;padding:2px 8px;border-radius:999px;font-weight:800;font-size:0.85rem;">Réponse utilisateur</span>' : '';
            return `
              <div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
                <div>
                  <div style="font-weight:800;color:var(--accent)">${t.title}</div>
                  <div style="color:#ddd;font-size:0.9rem">de <strong>${t.sender_username}</strong> — ${new Date(t.created_at).toLocaleString()} ${userReplyBadge}</div>
                </div>
                <div style="display:flex;gap:8px;align-items:center">
                  <button class="btn small" data-id="${t.id}" data-action="view">Voir</button>
                  <button class="btn small" data-id="${t.id}" data-action="delete">Supprimer</button>
                </div>
              </div>
            `;
          }).join('');
          listEl.innerHTML = out;
          listEl.querySelectorAll('button[data-action]').forEach(btn => btn.addEventListener('click', onTicketAction));
        }

        function createModal(contentHtml, { width = '720px' } = {}){
          const overlay = document.createElement('div');
          overlay.className = 'modal-overlay';
          overlay.innerHTML = `
            <div class="modal-card" style="max-width:${width}">
              <div class="modal-body">${contentHtml}</div>
            </div>
          `;
          document.body.appendChild(overlay);
          overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
          return overlay;
        }

        function showAdminMsg(msg){ const el = document.createElement('div'); el.className='page-banner info'; el.textContent = msg; document.body.appendChild(el); setTimeout(()=>el.remove(), 2400); }

        async function onTicketAction(e){
          const btn = e.currentTarget; const id = btn.getAttribute('data-id'); const action = btn.getAttribute('data-action');
          if(action === 'view'){
            try{
              const res = await fetch(API_BASE + '/tickets/' + encodeURIComponent(id) + '?username=' + encodeURIComponent(user.username));
              if(!res.ok){ showAdminMsg('Erreur'); return; }
              const data = await res.json();
              const ticket = data.ticket;
              const replies = data.replies || [];
              const replyList = replies.length === 0
                ? '<div style="color:#cfcfcf;">Aucune réponse pour le moment.</div>'
                : replies.map(r => {
                    const roleLabel = (r.sender_role === 'User') ? 'Réponse utilisateur' : 'Réponse admin';
                    const author = r.sender_username || r.admin_username || '';
                    return `<div style="padding:10px;border:1px solid rgba(255,212,0,0.06);border-radius:10px;margin-bottom:8px;background:rgba(255,212,0,0.03)"><div style="color:var(--accent);font-weight:700">${roleLabel}${author ? ' · ' + author : ''}</div><div style="color:#cfcfcf;font-size:0.9rem">${new Date(r.created_at).toLocaleString()}</div><div style="margin-top:6px;white-space:pre-wrap;color:#f5f5f5">${r.message.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div></div>`;
                  }).join('');

              const modal = createModal(`
                <div class="modal-header">
                  <div>
                    <div class="modal-title">${ticket.title}</div>
                    <div class="modal-meta">de <strong>${ticket.sender_username}</strong> — ${new Date(ticket.created_at).toLocaleString()}</div>
                  </div>
                  <button class="btn small ghost" id="closeTicketModal">Fermer</button>
                </div>
                <div class="modal-content">${ticket.content.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>
                <div style="margin-top:16px">
                  <div class="modal-title" style="font-size:1rem;margin-bottom:8px">Réponses</div>
                  <div id="replyList">${replyList}</div>
                </div>
                <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">
                  <div class="modal-title" style="font-size:1rem;">Répondre</div>
                  <textarea id="replyMessage" rows="4" style="width:100%;padding:.7rem;border-radius:10px;border:1px solid rgba(255,212,0,0.08);background:transparent;color:#fff"></textarea>
                  <div style="display:flex;justify-content:flex-end;gap:8px">
                    <button class="btn ghost" id="cancelReply">Fermer</button>
                    <button class="btn" id="sendReply">Envoyer</button>
                  </div>
                  <div id="replyErr" style="color:#ffb3b3;font-size:0.92rem"></div>
                </div>
              `, { width:'760px' });
              const close = ()=>modal.remove();
              modal.querySelector('#closeTicketModal').addEventListener('click', close);
              modal.querySelector('#cancelReply').addEventListener('click', close);
              modal.querySelector('#sendReply').addEventListener('click', async ()=>{
                const msgEl = modal.querySelector('#replyMessage');
                const errEl = modal.querySelector('#replyErr');
                const message = (msgEl.value||'').trim();
                if(!message){ errEl.textContent = 'Message vide'; return; }
                errEl.textContent = '';
                try{
                  const rres = await fetch(API_BASE + '/tickets/' + encodeURIComponent(id) + '/replies', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: user.username, message }) });
                  if(!rres.ok){ errEl.textContent = 'Erreur lors de l\'envoi'; return; }
                  msgEl.value='';
                  // refresh list
                  const updated = await fetch(API_BASE + '/tickets/' + encodeURIComponent(id) + '?username=' + encodeURIComponent(user.username));
                  if(updated.ok){
                    const udata = await updated.json();
                    const reps = udata.replies || [];
                    const html = reps.length === 0
                      ? '<div style="color:#cfcfcf;">Aucune réponse pour le moment.</div>'
                      : reps.map(r => {
                          const roleLabel = (r.sender_role === 'User') ? 'Réponse utilisateur' : 'Réponse admin';
                          const author = r.sender_username || r.admin_username || '';
                          return `<div style="padding:10px;border:1px solid rgba(255,212,0,0.06);border-radius:10px;margin-bottom:8px;background:rgba(255,212,0,0.03)"><div style="color:var(--accent);font-weight:700">${roleLabel}${author ? ' · ' + author : ''}</div><div style="color:#cfcfcf;font-size:0.9rem">${new Date(r.created_at).toLocaleString()}</div><div style="margin-top:6px;white-space:pre-wrap;color:#f5f5f5">${r.message.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div></div>`;
                        }).join('');
                    modal.querySelector('#replyList').innerHTML = html;
                  }
                  showAdminMsg('Réponse envoyée');
                }catch(err){ console.error('send reply', err); errEl.textContent = 'Erreur serveur'; }
              });
            }catch(err){ console.error(err); showAdminMsg('Erreur'); }
          } else if(action === 'delete'){
            const modal = createModal(`
              <div class="modal-header" style="margin-bottom:12px;">
                <div>
                  <div class="modal-title">Supprimer le ticket ?</div>
                  <div class="modal-meta">Cette action est définitive.</div>
                </div>
              </div>
              <div style="display:flex;gap:8px;justify-content:flex-end">
                <button class="btn ghost" id="cancelDel">Annuler</button>
                <button class="btn danger" id="confirmDel">Supprimer</button>
              </div>
            `, { width:'420px' });
            modal.querySelector('#cancelDel').addEventListener('click', ()=>modal.remove());
            modal.querySelector('#confirmDel').addEventListener('click', async ()=>{
              try{
                const res = await fetch(API_BASE + '/tickets/' + encodeURIComponent(id) + '/delete', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: user.username }) });
                if(!res.ok){ showAdminMsg('Erreur suppression'); return; }
                await res.json();
                showAdminMsg('Ticket supprimé');
                modal.remove();
                fetchTickets();
              }catch(err){ console.error('delete ticket', err); showAdminMsg('Erreur'); }
            });
          }
        }

        fetchTickets();
      })();
    </script>
  </body>
</html>
