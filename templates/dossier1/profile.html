<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profil — E-cities</title>
    <link rel="stylesheet" href="../../assets/styles/styles.css">
  </head>
  <body>
    <header class="top">
      <div class="container top-inner">
        <div class="brand">
          <img id="brandLogo" src="../../assets/images/logo.png" alt="E-cities logo" />
          <div class="brand-text">
            <div class="logo">E-cities</div>
            <div class="tag">Redécouvrez votre quartier</div>
          </div>
        </div>
        <nav class="nav">
          <a href="/templates/dossier1/index.html">Accueil</a>
          <a href="/templates/dossier1/projects.html">Projets Citoyens</a>
          <a href="/templates/dossier1/index.html#mission">Visualisation 3D</a>
          <a href="/templates/dossier1/index.html#contact">Contact</a>
          <button id="langBtn" class="lang" aria-pressed="false">FR</button>
          <button id="accountBtn" class="account-btn" aria-haspopup="dialog" aria-expanded="false">Compte</button>
        </nav>
      </div>
    </header>

    <main>
      <section class="container section boxed">
        <h2>Profil utilisateur</h2>
        <div style="display:flex;gap:2rem;align-items:flex-start;margin-top:1rem;flex-wrap:wrap">
          <div style="flex:1;min-width:220px">
            <div style="background:rgba(255,212,0,0.04);border-radius:12px;padding:1rem;border:1px solid rgba(255,212,0,0.06)">
              <div style="font-size:0.95rem;color:var(--muted)">Nom de compte</div>
              <div id="p-username" style="margin-top:.4rem;font-weight:800;color:var(--accent);font-size:1.25rem">—</div>
              <div style="margin-top:.6rem;color:#ddd" id="p-other">—</div>
            </div>
          </div>

          <div style="flex:2;min-width:260px">
            <div class="boxed" style="padding:1rem">
              <h3 style="margin-top:0;color:var(--accent)">Informations</h3>
              <p id="p-bio" style="color:#e9e9e9">Aucune information supplémentaire.</p>
              <div style="margin-top:1rem;display:flex;gap:.6rem">
                <button id="profileLogout" class="btn">Se déconnecter</button>
                <a id="editProfile" class="btn secondary" style="background:transparent;color:var(--accent);border:1px solid rgba(255,212,0,0.08);padding:.6rem .9rem;border-radius:8px;text-decoration:none">Modifier</a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      function getUser(){ try{return JSON.parse(localStorage.getItem('ecities_user'));}catch(e){return null;} }
      const user = getUser();
      if(!user){ document.getElementById('p-username').textContent = 'Non connecté'; document.getElementById('p-bio').textContent = 'Connectez-vous pour voir les informations de votre profil.'; }
      else{
        document.getElementById('p-username').textContent = user.username || '—';
        if(user.created_at) document.getElementById('p-other').textContent = 'Membre depuis ' + new Date(user.created_at).toLocaleDateString();
        if(user.email) document.getElementById('p-bio').textContent = user.email;
      }
      document.getElementById('profileLogout').addEventListener('click', ()=>{ localStorage.removeItem('ecities_user'); location.href='/templates/dossier1/index.html'; });
      document.getElementById('editProfile').addEventListener('click', function(e){ e.preventDefault(); alert('Édition du profil non implémentée.'); });
    </script>
  </body>
</html>
