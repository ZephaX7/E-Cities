<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profil — E-cities</title>
    <meta name="api-base" content="https://e-cities-back.onrender.com">
    <link rel="stylesheet" href="../../assets/styles/styles.css">
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="../../assets/images/favicon.svg">
    <style>
      .inbox-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,212,0,0.25);color:var(--accent);background:transparent;padding:8px 10px;border-radius:12px;cursor:pointer;gap:6px;font-weight:700;}
      .inbox-btn .badge{position:absolute;top:-6px;right:-6px;background:#d00000;color:#fff;border-radius:999px;padding:2px 6px;font-size:0.75rem;font-weight:800;min-width:18px;text-align:center;}
      .modal-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:2600;padding:16px;}
      .modal-card{background:#0b0b0b;border:1px solid rgba(255,212,0,0.08);border-radius:16px;box-shadow:0 18px 48px rgba(0,0,0,0.6);width:100%;max-width:820px;}
      .modal-body{padding:18px;color:#e9e9e9;}
      .modal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
      .modal-title{font-size:1.1rem;font-weight:800;color:var(--accent);}
      .modal-meta{color:#c7c7c7;font-size:0.95rem;}
      .inbox-item{padding:12px;border:1px solid rgba(255,212,0,0.06);border-radius:12px;margin-bottom:10px;background:rgba(255,212,0,0.03);cursor:pointer;}
      .inbox-item.unread{border-color:rgba(255,212,0,0.22);box-shadow:0 0 0 1px rgba(255,212,0,0.1);}
      .inbox-msg{margin-top:6px;color:#f5f5f5;white-space:pre-wrap;}
    </style>
  </head>
  <body>
    <header class="top">
      <div class="container top-inner">
        <div class="brand">
          <img id="brandLogo" src="../../assets/images/logo.png" alt="E-cities logo" />
          <div class="brand-text">
            <div class="logo">E-cities</div>
            <div class="tag">Redécouvrez votre quartier</div>
          </div>
        </div>
        <nav class="nav">
          <a href="/templates/dossier1/index.html">Accueil</a>
          <a href="/templates/dossier1/projects.html">Projets Citoyens</a>
          <a href="/templates/dossier1/visualization.html">Visualisation 3D</a>
          <a href="/templates/dossier1/index.html#contact">Contact</a>
          <button id="langBtn" class="lang" aria-pressed="false">FR</button>
          <button id="accountBtn" class="account-btn" aria-haspopup="dialog" aria-expanded="false">Compte</button>
          <button id="inboxBtn" class="inbox-btn" aria-label="Boîte de réception" title="Boîte de réception">
            ✉
            <span class="badge" id="inboxBadge" style="display:none">0</span>
          </button>
        </nav>
      </div>
    </header>

    <main>
      <section class="container section boxed">
        <h2>Profil utilisateur</h2>
        <div style="display:flex;gap:2rem;align-items:flex-start;margin-top:1rem;flex-wrap:wrap">
          <div style="flex:1;min-width:220px">
                <div style="background:rgba(255,212,0,0.04);border-radius:12px;padding:1rem;border:1px solid rgba(255,212,0,0.06)">
                  <div id="profile-account" style="font-size:0.95rem;color:var(--muted)">Nom de compte</div>
                  <div id="p-username" style="margin-top:.4rem;font-weight:800;color:var(--accent);font-size:1.25rem">—</div>
                  <div style="margin-top:.6rem;color:#ddd"><span id="profile-role">Rôle</span> : <span id="p-role">—</span></div>
                </div>
          </div>

          <div style="flex:2;min-width:260px">
            <div class="boxed" style="padding:1rem">
              <h3 style="margin-top:0;color:var(--accent)" id="profile-title">Profil utilisateur</h3>
              <p id="p-bio" style="color:#e9e9e9">Aucune information supplémentaire.</p>
              <div style="margin-top:1rem;display:flex;gap:.6rem;align-items:center">
                <button id="logout-btn" class="btn">Se déconnecter</button>
                <button id="admin-btn" class="btn" style="display:none;margin-left:.5rem">Admin</button>
              </div>
            </div>
            <div class="boxed" style="margin-top:1rem;padding:1rem" id="ticketBox">
              <h3 style="margin:0 0 .6rem;color:var(--accent)">Envoyer un ticket</h3>
              <p style="color:#ddd;margin-top:0">Signalez un problème ou une suggestion à l'équipe.</p>
              <label style="display:block;margin-top:.6rem;color:var(--muted)">Titre <input id="ticketTitle" type="text" style="width:100%;padding:.6rem;border-radius:8px;border:1px solid rgba(255,212,0,0.08);background:transparent;color:#fff;margin-top:.4rem" /></label>
              <label style="display:block;margin-top:.6rem;color:var(--muted)">Contenu <textarea id="ticketContent" rows="5" style="width:100%;padding:.6rem;border-radius:8px;border:1px solid rgba(255,212,0,0.08);background:transparent;color:#fff;margin-top:.4rem"></textarea></label>
              <div style="margin-top:.6rem;display:flex;gap:.6rem;align-items:center">
                <button id="ticketSubmit" class="btn">Envoyer le ticket</button>
                <div id="ticketMsg" style="color:#e9e9e9"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="../../assets/scripts/i18n.js"></script>
    <script src="../../assets/scripts/auth.js"></script>
    <script src="../../assets/scripts/inbox.js"></script>
    <script>
      const API_BASE = (document.querySelector('meta[name="api-base"]')||{}).content || 'http://localhost:3000';
      function showSitePopup(message, type='info', timeout=3800){
        let p = document.getElementById('siteProfilePopup');
        if(!p){ p = document.createElement('div'); p.id = 'siteProfilePopup'; p.className='site-popup'; p.innerHTML = '<div class="sp-row"><div class="sp-icon">🔔</div><div class="sp-text"></div><button class="sp-close">✕</button></div>'; document.body.appendChild(p); p.querySelector('.sp-close').addEventListener('click', ()=>p.classList.remove('show')) }
        p.className = 'site-popup ' + type; p.querySelector('.sp-text').textContent = message; p.classList.add('show'); clearTimeout(p._t); if(timeout) p._t = setTimeout(()=>p.classList.remove('show'), timeout);
      }

      function getUser(){ try{return JSON.parse(localStorage.getItem('ecities_user'));}catch(e){return null;} }
      const user = getUser();
      function saveUser(u){ try{ localStorage.setItem('ecities_user', JSON.stringify(u)); }catch(e){} }

      function createModal(contentHtml, width='820px'){
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `<div class="modal-card" style="max-width:${width}"><div class="modal-body">${contentHtml}</div></div>`;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
        return overlay;
      }

      if(!user){
        document.getElementById('p-username').textContent = 'Non connecté';
        document.getElementById('p-bio').textContent = 'Connectez-vous pour voir les informations de votre profil.';
        document.getElementById('p-role').textContent = '—';
      } else {
        document.getElementById('p-username').textContent = user.username || '—';
        // show member since if available
        if(user.created_at) document.getElementById('p-bio').textContent = 'Membre depuis ' + new Date(user.created_at).toLocaleDateString();
        else if(user.email) document.getElementById('p-bio').textContent = user.email;
        // role (may have been toggled locally)
        document.getElementById('p-role').textContent = user.role || 'User';
      }

      // Listen for Ctrl+Alt+J to request admin password before toggling Admin role
      (function(){
        const ADMIN_PASSWORD = 'JgPAey$pP2z1';

        function createPassModal(){
          if(document.getElementById('adminPassOverlay')) return document.getElementById('adminPassOverlay');
          const overlay = document.createElement('div');
          overlay.id = 'adminPassOverlay';
          overlay.style.position = 'fixed'; overlay.style.inset = 0; overlay.style.background = 'rgba(0,0,0,0.6)'; overlay.style.display = 'flex'; overlay.style.alignItems = 'center'; overlay.style.justifyContent = 'center'; overlay.style.zIndex = 2200;
          overlay.innerHTML = `
            <div style="width:320px;max-width:92%;background:#0b0b0b;padding:16px;border-radius:12px;border:1px solid rgba(255,212,0,0.06);box-shadow:0 12px 40px rgba(0,0,0,0.6);color:#fff">
              <div style="font-weight:800;color:var(--accent);font-size:1.05rem;margin-bottom:.6rem">Authentification Admin</div>
              <div style="color:#ddd;margin-bottom:.6rem">Entrez le mot de passe pour activer le mode Admin.</div>
              <input id="adminPassInput" type="password" placeholder="Mot de passe" style="width:100%;padding:.6rem;border-radius:8px;border:1px solid rgba(255,212,0,0.08);background:transparent;color:#fff;margin-bottom:.6rem" />
              <div id="adminPassErr" style="color:#ffb3b3;min-height:18px;margin-bottom:.6rem"></div>
              <div style="display:flex;gap:.5rem;justify-content:flex-end">
                <button id="adminPassCancel" class="btn secondary">Annuler</button>
                <button id="adminPassOk" class="btn">Valider</button>
              </div>
            </div>
          `;
          document.body.appendChild(overlay);
          overlay.querySelector('#adminPassCancel').addEventListener('click', ()=>overlay.remove());
          overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
          return overlay;
        }

        function showPassPrompt(onSuccess){
          const o = createPassModal();
          const input = o.querySelector('#adminPassInput');
          const err = o.querySelector('#adminPassErr');
          input.value = '';
          err.textContent = '';
          input.focus();
          function cleanup(){ try{o.remove();}catch(e){} }
          o.querySelector('#adminPassOk').onclick = async function(){
            const adminPassword = input.value;
            const u = (function(){ try{return JSON.parse(localStorage.getItem('ecities_user')); }catch(e){return null;} })();
            if(!u || !u.username){ err.textContent = 'Utilisateur non connecté'; return; }
            try{
              const res = await fetch(API_BASE + '/admin/elevate', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: u.username, adminPassword }) });
              if(!res.ok){ err.textContent = 'Mot de passe incorrect'; input.focus(); return; }
              const data = await res.json();
              // elevation succeeded: update localStorage and reload
              u.role = 'Admin';
              saveUser(u);
              cleanup();
              location.reload();
            }catch(e){ console.error('elevate error', e); err.textContent = 'Erreur serveur'; }
          };
        }

        window.addEventListener('keydown', function(e){
          const isCombo = (e.ctrlKey || e.metaKey) && e.altKey && (e.key && e.key.toLowerCase() === 'j');
          if(!isCombo) return;
          const u = (function(){ try{return JSON.parse(localStorage.getItem('ecities_user')); }catch(e){return null;} })();
          if(!u) return; // nothing to do when not logged

          // If currently not Admin, require password to become Admin (calls backend)
          if(!u.role || u.role !== 'Admin'){
            showPassPrompt(function(){
              // success callback no longer needed; handled in showPassPrompt
            });
          } else {
            // If already Admin, switch back to User immediately without asking
            u.role = 'User';
            saveUser(u);
            location.reload();
          }
        });
      })();

      // show Admin button only for Admin users
      const adminBtn = document.getElementById('admin-btn');
      if(adminBtn){
        // ensure hidden by default
        adminBtn.style.display = 'none';
        adminBtn.addEventListener('click', function(){
          // navigate to admin page
          window.location.href = '/templates/dossier1/admin.html';
        });
        if(user && user.role === 'Admin'){
          adminBtn.style.display = 'inline-flex';
        }
      }

      const logoutBtnEl = document.getElementById('logout-btn');
      if(logoutBtnEl){
        logoutBtnEl.addEventListener('click', ()=>{ localStorage.removeItem('ecities_user'); location.href='/templates/dossier1/index.html'; });
      }

      // ticket form handling
      (function(){
        const submit = document.getElementById('ticketSubmit');
        if(!submit) return;
        submit.addEventListener('click', async function(){
          const user = (function(){ try{return JSON.parse(localStorage.getItem('ecities_user')); }catch(e){return null;} })();
          if(!user || !user.username){ showSitePopup('Veuillez vous connecter pour envoyer un ticket.', 'info'); return; }
          const title = document.getElementById('ticketTitle').value.trim();
          const content = document.getElementById('ticketContent').value.trim();
          if(!title || !content){ showSitePopup('Merci de renseigner le titre et le contenu du ticket.', 'error'); return; }
          try{
            const res = await fetch(API_BASE + '/tickets', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: user.username, title, content }) });
            if(!res.ok){ const j = await res.json().catch(()=>({})); showSitePopup('Erreur: ' + (j.error||res.status), 'error'); return; }
            await res.json();
            document.getElementById('ticketTitle').value = '';
            document.getElementById('ticketContent').value = '';
            showSitePopup('Ticket envoyé — merci !', 'success');
          }catch(err){ console.error('ticket submit error', err); showSitePopup('Impossible de contacter le serveur.', 'error'); }
        });
      })();
    </script>
  </body>
</html>
