services:
  - type: web
    name: e-cities-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://your-frontend-on-vercel.com
      - key: PORT
        value: 10000
